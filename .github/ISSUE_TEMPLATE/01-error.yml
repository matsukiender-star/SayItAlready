name: 🐞 Reportar un error
description: Algo no funciona como debería.
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por avisar! Revisa antes las [preguntas frecuentes](https://github.com/matsukiender-star/SayItAlready/wiki/Preguntas-frecuentes).
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el problema.
      placeholder: Al inclinar hacia abajo cuenta como «pasar»…
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para que vuelva a pasar
      placeholder: |
        1. Abro el mazo Películas
        2. Pulso ¡Jugar!
        3. …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: ¿Qué esperabas que pasara?
  - type: dropdown
    id: plataforma
    attributes:
      label: ¿Dónde juegas?
      options:
        - App de Android (APK)
        - Versión web en Android
        - Versión web en iPhone
        - Versión web en computadora
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Teléfono y versión de Android/iOS
      placeholder: Samsung Galaxy A54, Android 14
  - type: input
    id: version
    attributes:
      label: Versión de ¡Dilo Ya!
      description: Está en ⚙️ Ajustes, debajo del nombre.
      placeholder: v2.0.0
  - type: dropdown
    id: control
    attributes:
      label: Control usado
      options:
        - Giroscopio
        - Deslizar
        - Botones
        - Teclado
        - No aplica
  - type: textarea
    id: capturas
    attributes:
      label: Capturas o video
      description: Si es del giroscopio, activa «Modo depuración del giroscopio» en Ajustes y manda una captura del panel.
