name: 💡 Pedir un cambio o una idea
description: Una función nueva, un cambio de diseño o una mejora.
title: "[Idea] "
labels: ["mejora"]
body:
  - type: textarea
    id: idea
    attributes:
      label: ¿Qué te gustaría?
      placeholder: Que al final de la ronda se pueda compartir el resultado por WhatsApp…
    validations:
      required: true
  - type: textarea
    id: para-que
    attributes:
      label: ¿Para qué te serviría?
      description: Cuéntanos la situación en la que lo usarías.
  - type: dropdown
    id: area
    attributes:
      label: ¿De qué parte de la app?
      options:
        - Pantalla de inicio
        - Partida
        - Resumen
        - Ajustes
        - Editor de mazos
        - Diseño y animaciones
        - Otra
  - type: textarea
    id: referencias
    attributes:
      label: Ejemplos o capturas
      description: Otra app que lo haga, un dibujo, una captura…
